# Secreton configuration.
#
# Precedence: defaults < this file < environment (`SECRETON__SECTION__KEY`).
# Secrets belong in the environment, not here — this file is meant to be committed.

[http]
bind_address = "127.0.0.1:3000"
timeout = 30
max_body_size = 16777216

# How many reverse proxies sit in front of this process.
#
# The client address is taken as the Nth `X-Forwarded-For` entry counted from the
# right. Zero means the header is ignored entirely and the socket peer address is
# used — correct when the process is exposed directly. Setting this higher than the
# real number of proxies lets a client forge its own address by prepending entries,
# which defeats per-client rate limiting.
trusted_proxies = 0

# Whether every connection this process accepts already arrived over TLS.
#
# This is the only trustworthy signal for a listener that terminates TLS itself: an
# HTTP/1.1 request in origin-form carries no URI scheme, and on HTTP/2 the scheme is a
# client-supplied `:scheme` pseudo-header, so the request cannot be asked. It gates the
# cookie's `Secure` attribute and HSTS. Leave it `false` when a reverse proxy terminates
# TLS and forwards over plain HTTP — there `X-Forwarded-Proto` from a trusted proxy is
# what the middleware reads. Setting it wrongly on a plain listener hands clients a
# `Secure` cookie over cleartext, so only enable it when the listener really is TLS.
https_only = false

[cors]
enabled = true
# Empty means same-origin only, which is correct because this process serves the UI.
# A wildcard is rejected at startup: it would let any page on the internet script this
# API with the visitor's credentials.
allowed_origins = []

[auth.jwt]
issuer = "secreton"
audience = "secreton-api"
# `secret` is deliberately absent. Set SECRETON__AUTH__JWT__SECRET (32 bytes minimum).
# It is never generated automatically: a secret invented at boot invalidates every
# issued token on the next restart.

[audit]
enabled = true
retention_days = 2555   # 7 years
max_batch_size = 100

[rate_limit]
enabled = true

[rate_limit.global]
requests = 600
window = 60

[storage]
# memory | file | postgres | redis | raft
#
# `memory` is the default so a fresh checkout runs with no setup; it is lost on
# restart. `raft` is experimental: single-node only, no cluster membership changes.
backend_type = "memory"

