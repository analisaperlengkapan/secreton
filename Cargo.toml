[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/crypto",
    "crates/storage",
    "crates/auth",
    "crates/engines",
    "crates/client",
    "crates/ui",
    "crates/server",
    "crates/cli",
    "crates/agent",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Irhas <analisaperlengkapan@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/analisaperlengkapan/secreton"
homepage = "https://github.com/analisaperlengkapan/secreton"
description = "Secrets management platform built on Leptos and Axum"
keywords = ["security", "secrets", "cryptography", "zero-trust", "vault"]
categories = ["cryptography", "authentication", "web-programming"]
# MSRV floor. The exact compiler used by CI and Docker is pinned in
# rust-toolchain.toml; this is the oldest release the code is expected to build on.
rust-version = "1.90"

[workspace.dependencies]
# ---- Internal crates -------------------------------------------------------
secreton-domain = { path = "crates/domain", version = "0.1.0" }
secreton-crypto = { path = "crates/crypto", version = "0.1.0" }
secreton-storage = { path = "crates/storage", version = "0.1.0" }
secreton-auth = { path = "crates/auth", version = "0.1.0" }
secreton-engines = { path = "crates/engines", version = "0.1.0" }
secreton-client = { path = "crates/client", version = "0.1.0" }
secreton-ui = { path = "crates/ui", version = "0.1.0" }

# ---- Async runtime ---------------------------------------------------------
tokio = "1.47"
tokio-stream = "0.1"
async-trait = "0.1"
futures = "0.3"
futures-util = "0.3"

# ---- Serialization ---------------------------------------------------------
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1"
# Replaces `bincode`, whose team announced a permanent end to development
# (RUSTSEC-2025-0141). It is used only to encode entries for the in-memory cache — never
# for anything persisted — so swapping the serializer needs no migration and nothing on
# disk changes. A permanently abandoned direct dependency in a secrets manager means no
# future fix for anything found in it, which is not a position worth holding for a
# transient encoding.
#
# `default-features = false` matters: postcard's default pulls `heapless` 0.7, which pulls
# `atomic-polyfill` — itself unmaintained (RUSTSEC-2023-0089). Trading one abandoned crate
# for another, further from our control, would be no improvement. `use-std` gives the
# std-backed API this crate needs and nothing else.
postcard = { version = "1.1", default-features = false, features = ["use-std"] }

# ---- Errors ----------------------------------------------------------------
anyhow = "1.0"
thiserror = "2.0"

# ---- Observability ---------------------------------------------------------
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }

# ---- Common utilities ------------------------------------------------------
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
regex = "1.12"
once_cell = "1.20"
dashmap = "6.1"
parking_lot = "0.12"
humantime-serde = "1.1"

# ---- Web: Leptos + Axum ----------------------------------------------------
leptos = "0.8"
leptos_axum = "0.8"
leptos_meta = "0.8"
leptos_router = "0.8"
axum = { version = "0.8", features = ["macros", "json", "tracing"] }
axum-extra = { version = "0.12", features = ["cookie", "typed-header"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = [
    "fs",
    "trace",
    "cors",
    "timeout",
    "limit",
    "request-id",
    "compression-full",
] }
http = "1"
hyper = { version = "1.7", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
governor = "0.10"
tower-governor = "0.7"


# ---- Web: client-side (wasm) ----------------------------------------------
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
web-sys = "0.3"

# ---- gRPC (optional, feature = "grpc") -------------------------------------
tonic = "0.14"
tonic-prost = "0.14"
tonic-build = "0.14"
tonic-prost-build = "0.14"
tonic-health = "0.14"
tonic-reflection = "0.14"
prost = "0.14"
protoc-bin-vendored = "3"

# ---- OpenAPI ---------------------------------------------------------------
# utoipa only. utoipa-swagger-ui is deliberately NOT used: its build script
# downloads a zip over the network, which breaks hermetic and air-gapped builds.
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }

# ---- Cryptography (pure Rust, RustCrypto + ring) ---------------------------
aes-gcm = "0.11"
chacha20poly1305 = "0.11"
argon2 = "0.6"
sha2 = "0.11"
sha3 = "0.12"
blake3 = "1.8"
hmac = "0.13"
hkdf = "0.13"
digest = "0.11"
subtle = "2.6"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
secrecy = { version = "0.10", features = ["serde"] }
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = "0.3"
ed25519-dalek = { version = "3.0", features = ["rand_core", "pkcs8"] }
x25519-dalek = "3.0"
p256 = { version = "0.14", features = ["getrandom"] }
p384 = { version = "0.14", features = ["getrandom"] }
# `rust_crypto` is the pure-Rust provider. It transitively enables `rsa`, which we do
# not want (RUSTSEC-2023-0071) but cannot drop: jsonwebtoken 10 installs its crypto
# provider from exactly one of `rust_crypto` or `aws_lc_rs`, and selecting the
# sub-features individually leaves no provider installed at all. The alternative,
# `aws_lc_rs`, replaces it with a C dependency.
#
# The RSA code is unreachable in practice: `JwtTokenService` signs and validates with
# `Validation::new(Algorithm::HS256)`, whose `algorithms` allowlist rejects every RS*
# token before a key is ever constructed. See the test in crates/auth/src/jwt.rs and the
# documented ignore in deny.toml.
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
totp-rs = { version = "5.6", default-features = false, features = ["otpauth"] }

# ---- Encoding --------------------------------------------------------------
base64 = "0.22"
base32 = "0.5"
hex = "0.4"

# ---- X.509 / PKI -----------------------------------------------------------
# `x509-parser` is enabled so `Issuer::from_ca_cert_pem` can read the CA's subject
# and key identifier straight from an existing CA certificate.
rcgen = { version = "0.14", features = ["x509-parser"] }
x509-parser = "0.18"
pem = "3.0"

# ---- TLS -------------------------------------------------------------------
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }

# ---- Storage backends ------------------------------------------------------
tokio-postgres = { version = "0.7", features = [
    "with-uuid-1",
    "with-chrono-0_4",
    "with-serde_json-1",
] }
tokio-postgres-rustls = "0.13"
deadpool-postgres = "0.14"
# Dynamic database credentials for MySQL. `default-features = false` drops the bundled
# zlib in favour of the Rust one; `default-rustls` selects rustls over native-tls, which
# is what the rest of the workspace already uses. It resolves to the aws-lc-rs provider —
# already present via reqwest, so this adds no new C dependency, though it is worth
# knowing that this is not a pure-Rust path.
mysql_async = { version = "0.37", default-features = false, features = [
    "default-rustls",
] }
redis = { version = "1.7", features = ["tokio-comp", "connection-manager"] }

# ---- Config / CLI ----------------------------------------------------------
config = { version = "0.15", default-features = false, features = ["toml"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
comfy-table = "7"
dirs = "7"
rpassword = "7"

# ---- Policy grammar --------------------------------------------------------
pest = "2.7"
pest_derive = "2.7"

# ---- Dev / test ------------------------------------------------------------
axum-test = "21"
proptest = { version = "1.5", default-features = false, features = ["std"] }
tokio-test = "0.4"
pretty_assertions = "1.4"
tempfile = "3.14"
wiremock = { version = "0.6", default-features = false }
criterion = { version = "0.7", features = ["html_reports"] }

# ============================================================================
# Lints — set once here, inherited by every crate via `[lints] workspace = true`
# ============================================================================

[workspace.lints.rust]
unsafe_code = "deny"
# `missing_debug_implementations` is deliberately not enabled. It fires hardest on
# `crates/crypto` — KeyManager, the wrapping keys, the encryption engines — and the only
# way to silence it there is to put a `Debug` impl on a type holding key material. That is
# precisely what invariant 7 in AGENTS.md forbids. A lint whose remedy is the bug is worse
# than no lint. Add `#[derive(Debug)]` where it helps diagnostics and the type holds no
# secret; never to satisfy a lint.
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# A secrets manager must not take the process down on malformed input, and it must
# not paper over a failure by substituting a default secret.
# `unwrap()` is silent about why it cannot fail; `expect("reason")` states the invariant
# where a reviewer will read it. So the first is warned and the second is not — the
# remedy for a flagged unwrap is to either handle the error or say, in the message, why
# there is none. Several real panics in this repository were unwraps whose justifying
# guard had drifted away or never existed.
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
# Silent truncation of a length or an index is a memory-safety-adjacent bug class.
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
# Holding a std lock across an await point deadlocks the runtime.
await_holding_lock = "deny"

# ============================================================================
# Build profiles
# ============================================================================

[profile.dev]
opt-level = 1
incremental = true
codegen-units = 256
split-debuginfo = "unpacked"

# Dependencies rarely change; optimising them keeps dev-mode runtime and test
# suites usable without slowing down incremental rebuilds of our own crates.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
debug = false
incremental = false
# Integer overflow is a security bug in a secrets manager, not a performance
# tradeoff, so the checks stay on in release builds.
overflow-checks = true
# `panic = "abort"` is deliberately NOT set: it disables `#[should_panic]`
# tests and unwinding in the cryptographic crates.

[profile.bench]
inherits = "release"
debug = true

# Optimise the wasm bundle for size rather than speed.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"

# ============================================================================
# cargo-leptos
# ============================================================================

[[workspace.metadata.leptos]]
name = "secreton"
bin-package = "secreton-server"
lib-package = "secreton-ui"

site-root = "target/site"
site-pkg-dir = "pkg"
site-addr = "127.0.0.1:3000"
reload-port = 3001

# `style-file` is deliberately absent. It pointed at crates/ui/style/main.css, a file
# that has never existed in this repository, and cargo-leptos reads it before doing
# anything else — so `cargo leptos build` failed at "No such file or directory" before
# reaching a single line of Rust. Styling goes through Tailwind, below; setting both is
# not how cargo-leptos is configured.
tailwind-input-file = "crates/ui/style/tailwind.css"
assets-dir = "crates/ui/public"

browserquery = "defaults"

bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
