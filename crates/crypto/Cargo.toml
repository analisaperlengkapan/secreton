[package]
name = "secreton-crypto"
description = "Cryptographic primitives, transit engine and seal for Secreton"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
secreton-domain.workspace = true

async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "macros", "rt"] }
tracing.workspace = true
uuid.workspace = true

# AEAD
aes-gcm.workspace = true
chacha20poly1305.workspace = true

# Hashing and password hashing
argon2.workspace = true
blake3.workspace = true
digest.workspace = true
hkdf.workspace = true
hmac.workspace = true
pbkdf2 = "0.13"
scrypt = "0.12"
sha2.workspace = true
sha3.workspace = true

# Signing.
#
# The `rsa` crate is deliberately NOT a dependency: RUSTSEC-2023-0071 (Marvin) is
# an unfixed timing side channel in its decryption path, and Ed25519 / the NIST
# curves cover every signing use in this codebase.
ed25519-dalek.workspace = true
k256 = { version = "0.14", features = ["ecdsa"] }
p256.workspace = true
p384.workspace = true
pkcs8 = { version = "0.11", features = ["alloc"] }
signature = "3.0"
x25519-dalek.workspace = true

# Shamir secret sharing for the unseal flow
num-bigint = { version = "0.4", features = ["rand"] }
num-integer = "0.1"
num-traits = "0.2"

base64.workspace = true
getrandom.workspace = true
hex.workspace = true
rand.workspace = true
subtle.workspace = true
zeroize.workspace = true

[dev-dependencies]
anyhow.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["full"] }
