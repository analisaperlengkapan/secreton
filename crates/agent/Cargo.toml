[package]
name = "secreton-agent"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Agent for Secreton system"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
secreton-client.workspace = true
secreton-domain.workspace = true
parking_lot.workspace = true
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

# Additional dependencies for agent functionality
clap = { workspace = true }
reqwest = { workspace = true }
handlebars = "6"
regex = { workspace = true }
futures = { workspace = true }
toml = { workspace = true }
rand = { workspace = true }

# System monitoring dependencies
sysinfo = "0.37"
nix = { version = "0.31", features = ["user"] }

# HTTP server for metrics
axum = { workspace = true }
hyper = { workspace = true }

# Cryptography for file hashing
sha2 = { workspace = true }
