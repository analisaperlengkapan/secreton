[package]
name = "secreton-auth"
description = "Authentication methods, identity, MFA, tokens, policy and governance for Secreton"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
secreton-crypto.workspace = true
secreton-domain.workspace = true
# Only for [`secreton_storage::StorageFence`] on the ownership-fenced MFA enrollment path.
# This crate sits above `storage` in the layering, so the dependency direction is allowed,
# and `secreton-auth` is not part of the `wasm32` build (`crates/ui` reaches it only through
# `secreton-engines` behind the `ssr` feature), so it cannot leak a server-only type into
# the UI build.
secreton-storage.workspace = true

anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "sync", "time", "macros", "rt"] }
tracing.workspace = true
uuid.workspace = true

# Tokens
jsonwebtoken.workspace = true

# Password hashing
argon2.workspace = true

# MFA
base32.workspace = true
glob = "0.3"
hmac.workspace = true
sha1 = "0.11"
sha2.workspace = true
totp-rs.workspace = true

# Policy grammar
pest.workspace = true
pest_derive.workspace = true

base64.workspace = true
hex.workspace = true
parking_lot.workspace = true
rand.workspace = true
regex.workspace = true
url.workspace = true
zeroize.workspace = true

# Optional auth methods
oauth2 = { version = "5.0", features = ["reqwest"], optional = true }
reqwest = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

[features]
default = ["oidc"]
oidc = ["dep:oauth2", "dep:reqwest"]
# Webhook audit sink. `WebhookAuditDevice` was gated on `#[cfg(feature = "reqwest")]`, a
# feature that does not exist — `dep:reqwest` creates no implicit feature — so the POST
# was compiled out of every build and `log()` returned `Ok(())` having sent nothing. An
# audit sink that silently drops events is worse than one that is absent, so the type
# itself now lives behind this feature: a build that cannot send cannot construct one.
webhook = ["dep:reqwest"]
